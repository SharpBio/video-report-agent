name: 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先搜索既有 Issue，避免重复。
        描述你想要的**结果**，而不只是实现方式——实现方式留给讨论。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在的流程哪里让你别扭？发生在什么场景？
      placeholder: |
        每次导出长图后想直接复制到剪贴板，现在只能存到下载目录再去找……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 你期望的交互或结果是什么样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有别的绕法？为什么不够好？
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 下载 / 取音频
        - 语音识别（ASR）
        - 报告生成（规划 / 分章 / 修订）
        - 报告展示与导出（HTML / 长图）
        - 历史记录
        - 后台浮层
        - 设置
        - 其他
    validations:
      required: true
