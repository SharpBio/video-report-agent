name: 缺陷报告
description: 报告一个问题（请不要包含 API Key 等敏感信息）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索既有 Issue，避免重复。
        日志请自行脱敏：删除 API Key、Token、个人路径等信息。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 浏览器与版本 / 操作系统 / 扩展加载方式
      placeholder: "Chrome 131 / Windows 11 / 开发者模式加载已解压扩展"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？实际结果与预期差在哪里？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 输入、命令或操作序列（视频链接可保留 BV 号）
      placeholder: |
        1. 打开视频页 ...
        2. 点击生成报告 ...
        3. 报错：...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 可附设置页「上次失败诊断」的复制内容，或 chrome://extensions 的错误列表。请先脱敏。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 自检
      options:
        - label: 我已搜索既有 Issue，没有重复
        - label: 日志中不包含任何密钥、Token 或个人敏感信息
        - label: 我已在最新 main 上复现
